<script>
        function handleClick(e) {
            e.preventDefault(); // stop instant page load
            const box = e.currentTarget;
            box.classList.add("clicked");

            setTimeout(() => {
                window.location.href = box.href;
            }, 350); // match your CSS transition duration
        }
    </script>
