<!-- =====================================================
     CATEGORY / GENDER
     ===================================================== -->

<script>

const categories = [

    { name: "Undergarments", file: "inner1" },

    { name: "Upper", file: "upper1" },

    { name: "Lower", file: "lower1" },

    { name: "Dress", file: "dress" },

    { name: "Thermals", file: "thermals1" }

];


const genders = [

    { name: "Gents", file: "gents" },

    { name: "Ladies", file: "ladies" },

    { name: "Kids", file: "kids" },

    { name: "Unisex", file: "unisex" }

];


const currentCategory = "dress";

const currentGender = "ladies";



/* =====================================================
   CATEGORY DROPDOWN
   ===================================================== */

const categoryDropdown =
    document.getElementById("categoryFilter");


const savedCategory =
    localStorage.getItem("selectedCategory");


const selectedCat = categories.find(cat =>

    cat.file === savedCategory ||
    cat.file === currentCategory

);


if (selectedCat) {

    const option =
        document.createElement("option");

    option.textContent =
        selectedCat.name;

    option.value =
        selectedCat.file + ".html";

    option.selected = true;

    categoryDropdown.appendChild(option);

}


categories.forEach(cat => {

    if (!selectedCat ||
        cat.file !== selectedCat.file) {

        const option =
            document.createElement("option");

        option.value =
            cat.file + ".html";

        option.textContent =
            cat.name;

        categoryDropdown.appendChild(option);

    }

});


categoryDropdown.addEventListener(
    "change",
    function () {

        const file =
            this.value.replace(".html", "");

        localStorage.setItem(
            "selectedCategory",
            file
        );

        window.location.href =
            this.value;

    }
);



/* =====================================================
   GENDER DROPDOWN
   ===================================================== */

const genderDropdown =
    document.getElementById("genderFilter");


const savedGender =
    localStorage.getItem("selectedGender");


const selectedGenderObj =
    genders.find(g =>

        g.file === savedGender ||
        g.file === currentGender

    );


if (selectedGenderObj) {

    const option =
        document.createElement("option");

    option.textContent =
        selectedGenderObj.name;

    option.value =
        selectedGenderObj.file + ".html";

    option.selected = true;

    genderDropdown.appendChild(option);

}


genders.forEach(g => {

    if (!selectedGenderObj ||
        g.file !== selectedGenderObj.file) {

        const option =
            document.createElement("option");

        option.value =
            g.file + ".html";

        option.textContent =
            g.name;

        genderDropdown.appendChild(option);

    }

});


genderDropdown.addEventListener(
    "change",
    function () {

        const file =
            this.value.replace(".html", "");

        localStorage.setItem(
            "selectedGender",
            file
        );

        window.location.href =
            this.value;

    }
);

</script>

<!-- =====================================================
     PRODUCT ENQUIRY JAVASCRIPT
     ===================================================== -->

<script>

/* =====================================================
   CONTACT DETAILS
   ===================================================== */

const whatsappNumber =
    "919234748585";


const emailAddress =
    "jagdishbastralaya1977@gmail.com";



/* =====================================================
   SELECTED PRODUCT
   ===================================================== */

let selectedProductImage = "";

let selectedProductName = "";



/* =====================================================
   FIND ALL PRODUCT IMAGES
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /*
         * Your product images are inside:
         *
         * .image-grid
         * .image-grid1
         * .image-grid2
         *
         * Therefore we select all images
         * inside these three containers.
         */

        const productImages =
            document.querySelectorAll(
                ".image-grid img, " +
                ".image-grid1 img, " +
                ".image-grid2 img"
            );


        productImages.forEach(
            function (image) {


                /* Make image clickable */

                image.style.cursor =
                    "pointer";


                image.addEventListener(
                    "click",
                    function () {

                        openProductModal(
                            this
                        );

                    }
                );

            }
        );


        /* Footer year */

        document.getElementById(
            "year"
        ).textContent =
            new Date().getFullYear();

    }
);



/* =====================================================
   OPEN PRODUCT POPUP
   ===================================================== */

function openProductModal(image) {


    /* Save clicked image */

    selectedProductImage =
        image.src;



    /*
     * Find the container containing
     * the clicked image.
     */

    const productContainer =
        image.parentElement;



    /*
     * The product heading is immediately
     * before the image container.
     */

    const heading =
        productContainer.previousElementSibling;



    /*
     * Get the correct product name.
     */

    if (
        heading &&
        heading.tagName.toLowerCase() === "h3"
    ) {

        selectedProductName =
            heading.textContent.trim();

    }

    else {

        /*
         * Fallback to image alt text.
         */

        selectedProductName =
            image.alt || "Product";

    }



    /* Show selected image */

    document.getElementById(
        "modalProductImage"
    ).src =
        selectedProductImage;



    /* Show question */

    document.getElementById(
        "productQuestion"
    ).style.display =
        "block";


    document.getElementById(
        "questionButtons"
    ).style.display =
        "flex";


    /* Hide contact options */

    document.getElementById(
        "contactOptions"
    ).style.display =
        "none";


    /* Open popup */

    document.getElementById(
        "productModal"
    ).classList.add("active");

}



/* =====================================================
   YES BUTTON
   ===================================================== */

function showContactOptions() {


    /* Hide question */

    document.getElementById(
        "productQuestion"
    ).style.display =
        "none";


    document.getElementById(
        "questionButtons"
    ).style.display =
        "none";


    /* Show contact buttons */

    document.getElementById(
        "contactOptions"
    ).style.display =
        "block";



    /* =================================================
       IMAGE URL
       ================================================= */

    const imageURL =
        new URL(
            selectedProductImage,
            window.location.href
        ).href;



    /* =================================================
       WHATSAPP MESSAGE
       ================================================= */

    const whatsappMessage =

        "Hello Jagdish Bastralaya,\n\n" +

        "I want to know more about this product.\n\n" +

        "Product: " +

        selectedProductName +

        "\n\n" +

        "Product image:\n" +

        imageURL;



    const whatsappURL =

        "https://wa.me/" +

        whatsappNumber +

        "?text=" +

        encodeURIComponent(
            whatsappMessage
        );


    document.getElementById(
        "whatsappLink"
    ).href =
        whatsappURL;



    /* =================================================
       EMAIL
       ================================================= */

    const emailSubject =

        "Product Enquiry - " +

        selectedProductName;



    const emailBody =

        "Hello Jagdish Bastralaya,\n\n" +

        "I want to know more about this product.\n\n" +

        "Product: " +

        selectedProductName +

        "\n\n" +

        "Product image:\n" +

        imageURL;



    const emailURL =

        "mailto:" +

        emailAddress +

        "?subject=" +

        encodeURIComponent(
            emailSubject
        ) +

        "&body=" +

        encodeURIComponent(
            emailBody
        );


    document.getElementById(
        "emailLink"
    ).href =
        emailURL;

}



/* =====================================================
   CLOSE POPUP
   ===================================================== */

function closeProductModal() {

    document.getElementById(
        "productModal"
    ).classList.remove(
        "active"
    );

}



/* =====================================================
   CLICK OUTSIDE POPUP
   ===================================================== */

document.addEventListener(
    "click",
    function (event) {


        const modal =
            document.getElementById(
                "productModal"
            );


        if (
            event.target === modal
        ) {

            closeProductModal();

        }

    }
);



/* =====================================================
   ESCAPE KEY
   ===================================================== */

document.addEventListener(
    "keydown",
    function (event) {


        if (
            event.key === "Escape"
        ) {

            closeProductModal();

        }

    }
);

</script>
