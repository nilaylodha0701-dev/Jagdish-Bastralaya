<!-- =========================================
     CATEGORY + GENDER
========================================= -->

<script>

const categories = [

    { name: "Undergarments", file: "inner1" },

    { name: "Upper", file: "upper1" },

    { name: "Lower", file: "lower1" },

    { name: "Dress", file: "dress" },

    { name: "Thermals", file: "thermals1" }

];


const genders = [

    { name: "Gents", file: "gents" },

    { name: "Ladies", file: "ladies" },

    { name: "Kids", file: "kids" },

    { name: "Unisex", file: "unisex" }

];


const currentCategory = "lower1";

const currentGender = "ladies";


/* =========================================
   CATEGORY DROPDOWN
========================================= */

const categoryDropdown =
    document.getElementById("categoryFilter");


const savedCategory =
    localStorage.getItem("selectedCategory");


const selectedCat = categories.find(cat =>
    cat.file === savedCategory ||
    cat.file === currentCategory
);


if (selectedCat) {

    const option =
        document.createElement("option");

    option.textContent =
        selectedCat.name;

    option.selected = true;

    categoryDropdown.appendChild(option);

}


categories.forEach(cat => {

    if (!selectedCat || cat.file !== selectedCat.file) {

        const option =
            document.createElement("option");

        option.value =
            cat.file + ".html";

        option.textContent =
            cat.name;

        categoryDropdown.appendChild(option);

    }

});


categoryDropdown.addEventListener(
    "change",
    function () {

        const file =
            this.value.replace(".html", "");

        localStorage.setItem(
            "selectedCategory",
            file
        );

        window.location.href =
            this.value;

    }
);


/* =========================================
   GENDER DROPDOWN
========================================= */

const genderDropdown =
    document.getElementById("genderFilter");


const savedGender =
    localStorage.getItem("selectedGender");


const selectedGenderObj = genders.find(g =>
    g.file === savedGender ||
    g.file === currentGender
);


if (selectedGenderObj) {

    const option =
        document.createElement("option");

    option.textContent =
        selectedGenderObj.name;

    option.selected = true;

    genderDropdown.appendChild(option);

}


genders.forEach(g => {

    if (
        !selectedGenderObj ||
        g.file !== selectedGenderObj.file
    ) {

        const option =
            document.createElement("option");

        option.value =
            g.file + ".html";

        option.textContent =
            g.name;

        genderDropdown.appendChild(option);

    }

});


genderDropdown.addEventListener(
    "change",
    function () {

        const file =
            this.value.replace(".html", "");

        localStorage.setItem(
            "selectedGender",
            file
        );

        window.location.href =
            this.value;

    }
);

</script>

<!-- =========================================
     PRODUCT ENQUIRY JAVASCRIPT
========================================= -->

<script>


/* =========================================
   YOUR CONTACT DETAILS
========================================= */

const whatsappNumber =
    "919234748585";


const emailAddress =
    "jagdishbastralaya1977@gmail.com";



/* =========================================
   SELECTED PRODUCT VARIABLES
========================================= */

let selectedProductImage = "";

let selectedProductName = "";



/* =========================================
   MAKE ALL PRODUCT IMAGES CLICKABLE
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /*
         * IMPORTANT:
         *
         * Instead of only selecting ".grid img",
         * we select ALL product images inside
         * .grid.
         *
         * This also includes images inside
         * the Jeans .card elements.
         */

        const productImages =
            document.querySelectorAll(
                ".grid img"
            );


        productImages.forEach(
            function (image) {


                /* Make image look clickable */

                image.style.cursor =
                    "pointer";



                image.addEventListener(
                    "click",
                    function () {


                        /*
                         * Save clicked image
                         */

                        selectedProductImage =
                            this.src;



                        /*
                         * Get product name
                         *
                         * For Jeans:
                         * the name is inside <span>
                         *
                         * For other products:
                         * there may not be a name.
                         */

                        let productName = "";



                        /* Check parent card */

                        const card =
                            this.closest(".card");


                        if (card) {

                            const span =
                                card.querySelector("span");


                            if (span) {

                                productName =
                                    span.textContent.trim();

                            }

                        }



                        /*
                         * If there is no card,
                         * try to find an image name.
                         */

                        if (!productName) {

                            const parent =
                                this.parentElement;


                            const nameElement =
                                parent.querySelector(
                                    ".img-name"
                                );


                            if (nameElement) {

                                productName =
                                    nameElement.textContent
                                    .trim();

                            }

                        }



                        /*
                         * If still no name,
                         * use ALT text.
                         */

                        if (!productName) {

                            productName =
                                this.alt ||
                                "Product";

                        }



                        selectedProductName =
                            productName;



                        /*
                         * Put selected image
                         * inside popup
                         */

                        document.getElementById(
                            "modalProductImage"
                        ).src =
                            selectedProductImage;



                        /*
                         * Show question
                         */

                        document.getElementById(
                            "productQuestion"
                        ).style.display =
                            "block";


                        document.getElementById(
                            "questionButtons"
                        ).style.display =
                            "flex";



                        /*
                         * Hide contact options
                         */

                        document.getElementById(
                            "contactOptions"
                        ).style.display =
                            "none";



                        /*
                         * Open popup
                         */

                        document.getElementById(
                            "productModal"
                        ).classList.add(
                            "active"
                        );

                    }

                );

            }

        );

    }

);



/* =========================================
   YES BUTTON
========================================= */

function showContactOptions() {


    /*
     * Hide question
     */

    document.getElementById(
        "productQuestion"
    ).style.display =
        "none";


    document.getElementById(
        "questionButtons"
    ).style.display =
        "none";



    /*
     * Show contact options
     */

    document.getElementById(
        "contactOptions"
    ).style.display =
        "block";



    /*
     * Create FULL image URL
     */

    const imageURL =
        new URL(
            selectedProductImage,
            window.location.href
        ).href;



    /* =========================================
       WHATSAPP MESSAGE
    ========================================= */

    const whatsappMessage =

        "Hello Jagdish Bastralaya,\n\n" +

        "I want to know more about this product.\n\n" +

        "Product: " +

        selectedProductName +

        "\n\n" +

        "Product image:\n" +

        imageURL;



    const whatsappURL =

        "https://wa.me/" +

        whatsappNumber +

        "?text=" +

        encodeURIComponent(
            whatsappMessage
        );



    document.getElementById(
        "whatsappLink"
    ).href =
        whatsappURL;



    /* =========================================
       EMAIL
    ========================================= */

    const emailSubject =

        "Product Enquiry - " +

        selectedProductName;



    const emailBody =

        "Hello Jagdish Bastralaya,\n\n" +

        "I want to know more about this product.\n\n" +

        "Product: " +

        selectedProductName +

        "\n\n" +

        "Product image:\n" +

        imageURL;



    const emailURL =

        "mailto:" +

        emailAddress +

        "?subject=" +

        encodeURIComponent(
            emailSubject
        ) +

        "&body=" +

        encodeURIComponent(
            emailBody
        );



    document.getElementById(
        "emailLink"
    ).href =
        emailURL;

}



/* =========================================
   CLOSE POPUP
========================================= */

function closeProductModal() {


    document.getElementById(
        "productModal"
    ).classList.remove(
        "active"
    );


    /*
     * Reset popup
     */

    document.getElementById(
        "productQuestion"
    ).style.display =
        "block";


    document.getElementById(
        "questionButtons"
    ).style.display =
        "flex";


    document.getElementById(
        "contactOptions"
    ).style.display =
        "none";

}



/* =========================================
   CLICK OUTSIDE POPUP
========================================= */

document.getElementById(
    "productModal"
).addEventListener(
    "click",
    function (event) {


        if (event.target === this) {

            closeProductModal();

        }

    }
);



/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
    "keydown",
    function (event) {


        if (event.key === "Escape") {

            closeProductModal();

        }

    }
);


</script>
