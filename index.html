<body>

>

            <!-- WhatsApp Support -->

        </div>

    </div>



    <!-- =====================================================
         WHATSAPP LANGUAGE POPUP
    ====================================================== -->

    <div
        class="language-overlay"
        id="languageOverlay"
    >

        <div class="language-popup">


            <!-- Close Button -->

            <button
                class="close-language"
                id="closeLanguage"
                aria-label="Close"
            >
                &times;
            </button>


            <!-- WhatsApp Icon -->

            <div class="language-icon">

                <i class="fa-brands fa-whatsapp"></i>

            </div>


            <h2>
                Choose Your Language
            </h2>


            <p>
                Select your preferred language for WhatsApp support.
            </p>


            <!-- Language Buttons -->

            <div class="language-list">


                <!-- English -->

                <button
                    class="language-option"
                    data-message="Hello Jagdish Bastralaya, I would like to know more about your clothing collection."
                >

                    🇬🇧 English

                </button>


                <!-- Hindi -->

                <button
                    class="language-option"
                    data-message="नमस्ते जगदीश बस्त्रालय, मुझे आपके कपड़ों के कलेक्शन के बारे में जानकारी चाहिए।"
                >

                    🇮🇳 हिंदी

                </button>


            </div>

        </div>

    </div>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <p>

            &copy;

            <span id="year"></span>

            Jagdish Bastralaya.

            All rights reserved.

        </p>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =================================================
           CURRENT YEAR
        ================================================= */

        document.getElementById("year").textContent =
            new Date().getFullYear();



        /* =================================================
           WHATSAPP POPUP
        ================================================= */

        const whatsappButton =
            document.getElementById("whatsappButton");

        const languageOverlay =
            document.getElementById("languageOverlay");

        const closeLanguage =
            document.getElementById("closeLanguage");

        const languageOptions =
            document.querySelectorAll(".language-option");



        /* Open popup */

        whatsappButton.addEventListener("click", function(event) {

            event.preventDefault();

            languageOverlay.classList.add("show");

            document.body.classList.add("popup-open");

        });



        /* Close popup */

        closeLanguage.addEventListener("click", function() {

            languageOverlay.classList.remove("show");

            document.body.classList.remove("popup-open");

        });



        /* Close by clicking outside */

        languageOverlay.addEventListener("click", function(event) {

            if (event.target === languageOverlay) {

                languageOverlay.classList.remove("show");

                document.body.classList.remove("popup-open");

            }

        });



        /* =================================================
           WHATSAPP LANGUAGE SELECTION
        ================================================= */

        languageOptions.forEach(function(button) {

            button.addEventListener("click", function() {

                const message =
                    button.getAttribute("data-message");


                /*
                 * REPLACE THIS WITH YOUR
                 * ACTUAL WHATSAPP NUMBER.
                 *
                 * Example:
                 * 919876543210
                 */

                const phoneNumber =
                    "919234748585";


                const whatsappURL =
                    "https://wa.me/" +
                    phoneNumber +
                    "?text=" +
                    encodeURIComponent(message);


                window.open(
                    whatsappURL,
                    "_blank"
                );

            });

        });

    </script>


</body>
