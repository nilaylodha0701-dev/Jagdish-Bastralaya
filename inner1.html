<body>
<!-- 🔥 HEADER -->
<div class="header">
  <a href="index.html" class="home-btn">Home</a>
    <select id="categoryFilter"></select>
    <select id="genderFilter"></select>
</div>

<script>
// ================= CATEGORY =================
const categories = [
    { name: "Undergarments", file: "inner1" },
    { name: "Upper", file: "upper1" },
    { name: "Lower", file: "lower1" },
    { name: "Dress", file: "dress" },
    { name: "Thermals", file: "thermals1" }
];

// ================= GENDER =================
const genders = [
    { name: "Gents", file: "gents" },
    { name: "Ladies", file: "ladies" },
    { name: "Kids", file: "kids" },
    { name: "Unisex", file: "unisex" }
];

// ✅ CURRENT PAGE (CHANGE PER PAGE)
const currentCategory = "inner1";
const currentGender = "ladies";

// ================= CATEGORY DROPDOWN =================
const categoryDropdown = document.getElementById("categoryFilter");

const savedCategory = localStorage.getItem("selectedCategory");

// 👉 Find selected category
const selectedCat = categories.find(cat =>
    cat.file === savedCategory || cat.file === currentCategory
);

// 👉 Show selected on top
if (selectedCat) {
    const option = document.createElement("option");
    option.textContent = selectedCat.name;
    option.selected = true;
    categoryDropdown.appendChild(option);
}

// 👉 Add remaining categories
categories.forEach(cat => {
    if (cat.file !== selectedCat.file) {
        const option = document.createElement("option");
        option.value = cat.file + ".html";
        option.textContent = cat.name;
        categoryDropdown.appendChild(option);
    }
});

// 👉 Save + redirect
categoryDropdown.addEventListener("change", function () {
    const file = this.value.replace(".html", "");
    localStorage.setItem("selectedCategory", file);
    window.location.href = this.value;
});


// ================= GENDER DROPDOWN =================
const genderDropdown = document.getElementById("genderFilter");

const savedGender = localStorage.getItem("selectedGender");

// 👉 Find selected gender
const selectedGenderObj = genders.find(g =>
    g.file === savedGender || g.file === currentGender
);

// 👉 Show selected
if (selectedGenderObj) {
    const option = document.createElement("option");
    option.textContent = selectedGenderObj.name;
    option.selected = true;
    genderDropdown.appendChild(option);
}

// 👉 Add remaining genders
genders.forEach(g => {
    if (g.file !== selectedGenderObj.file) {
        const option = document.createElement("option");
        option.value = g.file + ".html";
        option.textContent = g.name;
        genderDropdown.appendChild(option);
    }
});

// 👉 Save + redirect
genderDropdown.addEventListener("change", function () {
    const file = this.value.replace(".html", "");
    localStorage.setItem("selectedGender", file);
    window.location.href = this.value;
});
</script>
