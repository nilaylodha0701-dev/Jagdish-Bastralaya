<!-- =====================================================
     GENDER DROPDOWN
====================================================== -->

<script>

const genders = [

    {
        name: "Gents",
        file: "gents"
    },

    {
        name: "Ladies",
        file: "ladies"
    },

    {
        name: "Kids",
        file: "kids"
    },

    {
        name: "Unisex",
        file: "unisex"
    }

];


const currentGender = "ladies";


const genderDropdown =
    document.getElementById("genderFilter");


const savedGender =
    localStorage.getItem("selectedGender");


const selectedGenderObj =
    genders.find(g =>
        g.file === savedGender ||
        g.file === currentGender
    );


if (selectedGenderObj) {

    const option =
        document.createElement("option");

    option.textContent =
        selectedGenderObj.name;

    option.selected = true;

    genderDropdown.appendChild(option);

}


genders.forEach(g => {

    if (
        !selectedGenderObj ||
        g.file !== selectedGenderObj.file
    ) {

        const option =
            document.createElement("option");

        option.value =
            g.file + ".html";

        option.textContent =
            g.name;

        genderDropdown.appendChild(option);

    }

});


genderDropdown.addEventListener(
    "change",
    function () {

        const file =
            this.value.replace(".html", "");

        localStorage.setItem(
            "selectedGender",
            file
        );

        window.location.href =
            this.value;

    }
);

</script>

<!-- =====================================================
     ENQUIRY JAVASCRIPT
====================================================== -->

<script>


/* =====================================================
   CONTACT DETAILS
====================================================== */


const whatsappNumber =
    "919234748585";


const emailAddress =
    "jagdishbastralaya1977@gmail.com";



/* =====================================================
   SELECTED PRODUCT
====================================================== */


let selectedProductName = "";

let selectedProductImage = "";



/* =====================================================
   PAGE LOADED
====================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* ===============================
           FOOTER YEAR
        =============================== */

        document.getElementById("year")
            .textContent =
            new Date().getFullYear();



        /* ===============================
           FIND ALL PRODUCT IMAGES
        =============================== */

        const productImages =
            document.querySelectorAll(
                ".product-image"
            );



        /* ===============================
           MAKE IMAGES CLICKABLE
        =============================== */

        productImages.forEach(
            function (image) {


                image.style.cursor =
                    "pointer";


                image.addEventListener(
                    "click",
                    function () {

                        openProductModal(this);

                    }
                );

            }
        );

    }
);



/* =====================================================
   OPEN PRODUCT POPUP
====================================================== */

function openProductModal(image) {


    /* ===============================
       GET PRODUCT NAME
    =============================== */

    selectedProductName =
        image.getAttribute(
            "data-product-name"
        );



    /* ===============================
       GET IMAGE
    =============================== */

    selectedProductImage =
        image.src;



    /* ===============================
       MODAL
    =============================== */

    const modal =
        document.getElementById(
            "productModal"
        );



    /* ===============================
       SHOW IMAGE
    =============================== */

    document.getElementById(
        "modalProductImage"
    ).src =
        selectedProductImage;



    /* ===============================
       SHOW PRODUCT NAME
    =============================== */

    document.getElementById(
        "modalProductName"
    ).textContent =
        selectedProductName;



    /* ===============================
       SHOW QUESTION
    =============================== */

    document.getElementById(
        "productQuestion"
    ).style.display =
        "block";


    document.getElementById(
        "questionButtons"
    ).style.display =
        "flex";



    /* ===============================
       HIDE CONTACT OPTIONS
    =============================== */

    document.getElementById(
        "contactOptions"
    ).style.display =
        "none";



    /* ===============================
       SHOW MODAL
    =============================== */

    modal.classList.add("active");

}



/* =====================================================
   YES BUTTON
====================================================== */

function showContactOptions() {


    /* ===============================
       HIDE QUESTION
    =============================== */

    document.getElementById(
        "productQuestion"
    ).style.display =
        "none";


    document.getElementById(
        "questionButtons"
    ).style.display =
        "none";



    /* ===============================
       SHOW CONTACT OPTIONS
    =============================== */

    document.getElementById(
        "contactOptions"
    ).style.display =
        "block";



    /* =================================================
       IMAGE URL
    ================================================== */

    const imageURL =
        new URL(
            selectedProductImage,
            window.location.href
        ).href;



    /* =================================================
       WHATSAPP MESSAGE
    ================================================== */

    const whatsappMessage =

        "Hello Jagdish Bastralaya,\n\n" +

        "I want to know more about this product.\n\n" +

        "Product Name: " +

        selectedProductName +

        "\n\n" +

        "Product image:\n" +

        imageURL;



    const whatsappURL =

        "https://wa.me/" +

        whatsappNumber +

        "?text=" +

        encodeURIComponent(
            whatsappMessage
        );



    document.getElementById(
        "whatsappLink"
    ).href =
        whatsappURL;



    /* =================================================
       EMAIL
    ================================================== */

    const emailSubject =

        "Product Enquiry - " +

        selectedProductName;



    const emailBody =

        "Hello Jagdish Bastralaya,\n\n" +

        "I want to know more about this product.\n\n" +

        "Product Name: " +

        selectedProductName +

        "\n\n" +

        "Product image:\n" +

        imageURL;



    const emailURL =

        "mailto:" +

        emailAddress +

        "?subject=" +

        encodeURIComponent(
            emailSubject
        ) +

        "&body=" +

        encodeURIComponent(
            emailBody
        );



    document.getElementById(
        "emailLink"
    ).href =
        emailURL;

}



/* =====================================================
   CLOSE POPUP
====================================================== */

function closeProductModal() {

    document.getElementById(
        "productModal"
    ).classList.remove(
        "active"
    );

}



/* =====================================================
   CLICK OUTSIDE POPUP
====================================================== */

document.addEventListener(
    "click",
    function (event) {


        const modal =
            document.getElementById(
                "productModal"
            );


        if (
            event.target === modal
        ) {

            closeProductModal();

        }

    }
);



/* =====================================================
   ESCAPE KEY
====================================================== */

document.addEventListener(
    "keydown",
    function (event) {


        if (
            event.key === "Escape"
        ) {

            closeProductModal();

        }

    }
);

</script>
